<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Buddy - Manage Tasks & Focus</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            purple: '#E9D5FF',
                            purpleDark: '#C084FC',
                            pink: '#FBCFE8',
                            pinkDark: '#F472B6',
                            cream: '#FEF3C7',
                            bg: '#FAF5FF',
                            text: '#475569'
                        }
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #FAF5FF; color: #475569; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }

        /* Remove input number arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* Animations */
        @keyframes tearOff {
            0% { transform: translateY(0) rotate(0); opacity: 1; }
            100% { transform: translateY(300px) rotate(-15deg); opacity: 0; }
        }
        .tear-animation { animation: tearOff 0.6s forwards cubic-bezier(0.5, 0, 0.2, 1); pointer-events: none; }
        
        @keyframes popIn {
            0% { transform: scale(0.8) translateY(-20px); opacity: 0; }
            70% { transform: scale(1.02) translateY(0); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes runAround {
            0% { transform: translateX(-120px) scaleX(1) translateY(0); }
            12% { transform: translateX(-60px) scaleX(1) translateY(-15px); }
            25% { transform: translateX(0px) scaleX(1) translateY(0); }
            37% { transform: translateX(60px) scaleX(1) translateY(-15px); }
            50% { transform: translateX(120px) scaleX(1) translateY(0); }
            51% { transform: translateX(120px) scaleX(-1) translateY(0); }
            62% { transform: translateX(60px) scaleX(-1) translateY(-15px); }
            75% { transform: translateX(0px) scaleX(-1) translateY(0); }
            87% { transform: translateX(-60px) scaleX(-1) translateY(-15px); }
            100% { transform: translateX(-120px) scaleX(-1) translateY(0); }
        }
        .running-bunny { animation: runAround 4s infinite linear; }
        
        /* Receipt Jagged Edge */
        .jagged-bottom {
            background-image: radial-gradient(circle at 10px 0, transparent 10px, #ffffff 11px);
            background-size: 20px 20px;
            background-repeat: repeat-x;
            height: 15px;
            width: 100%;
            position: absolute;
            bottom: -15px;
            left: 0;
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Initialize Supabase ---
        const supabaseUrl = 'https://bosmyroykyviwhnyujoq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvc215cm95a3l2aXdobnl1am9xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0Mjc2MDIsImV4cCI6MjEwOTAwMzYwMn0.nD-DRjt9PGZH4lHOrVQ8chib5a4yYH-u-5eAonX2faY';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // --- SVGs & Icons ---
        const IconHome = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
        const IconList = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>;
        const IconClock = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
        const IconHistory = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>;
        const IconLogOut = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>;
        const IconCheck = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconLoader = () => <svg className="animate-spin -ml-1 mr-2 h-5 w-5 text-current" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>;

        const CuteBunny = ({ className }) => (
            <svg width="60" height="60" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
                <path d="M22 15C22 15 20 2 28 4C36 6 30 20 30 20" stroke="#F472B6" strokeWidth="3" strokeLinecap="round"/>
                <path d="M42 15C42 15 44 2 36 4C28 6 34 20 34 20" stroke="#F472B6" strokeWidth="3" strokeLinecap="round"/>
                <circle cx="32" cy="36" r="16" fill="#FBCFE8" stroke="#F472B6" strokeWidth="3"/>
                <circle cx="27" cy="34" r="2" fill="#475569"/>
                <circle cx="37" cy="34" r="2" fill="#475569"/>
                <path d="M31 38Q32 40 33 38" stroke="#475569" strokeWidth="2" strokeLinecap="round"/>
                <circle cx="23" cy="38" r="3" fill="#F472B6" fillOpacity="0.5"/>
                <circle cx="41" cy="38" r="3" fill="#F472B6" fillOpacity="0.5"/>
            </svg>
        );

        // --- Reusable UI Components ---
        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-3xl shadow-sm border border-pastel-purple/30 p-6 ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, onClick, variant = "primary", className = "", type = "button", disabled = false }) => {
            const baseStyle = "px-6 py-3 rounded-2xl font-medium transition-all duration-300 flex items-center justify-center gap-2";
            const activeStyle = disabled ? "opacity-50 cursor-not-allowed" : "hover:-translate-y-1 hover:shadow-lg active:scale-95";
            const variants = {
                primary: "bg-pastel-purpleDark text-white hover:bg-purple-500 shadow-md shadow-purple-200",
                secondary: "bg-pastel-pink text-pink-900 hover:bg-pink-300",
                outline: "border-2 border-pastel-purple text-pastel-purpleDark hover:bg-pastel-purple/20",
                ghost: "text-slate-500 hover:bg-slate-100"
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${activeStyle} ${className}`}>
                    {children}
                </button>
            );
        };

        // --- Screens ---

        // 1. Login Screen
        const LoginScreen = ({ onLoginSuccess }) => {
            const [isRegister, setIsRegister] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setErrorMsg('');
                
                try {
                    if (isRegister) {
                        const { data, error } = await supabase.auth.signUp({ email, password });
                        if (error) throw error;
                        if (data.user) onLoginSuccess(data.user);
                    } else {
                        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        if (data.user) onLoginSuccess(data.user);
                    }
                } catch (err) {
                    setErrorMsg(err.message === 'Invalid login credentials' ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen w-full flex items-center justify-center p-6 bg-gradient-to-br from-pastel-bg to-pastel-pink/20">
                    <Card className="w-full max-w-md animate-fade-in shadow-xl shadow-purple-900/10">
                        <div className="text-center mb-8">
                            <img 
                                src="image_4.png" 
                                alt="Focus Buddy Logo" 
                                className="w-20 h-20 rounded-3xl mx-auto mb-4 shadow-sm transform transition-transform hover:scale-110 duration-300 object-cover"
                            />
                            <h1 className="text-2xl font-bold text-slate-800">Focus Buddy</h1>
                            <p className="text-slate-500 mt-2">
                                {isRegister ? 'สร้างบัญชีเพื่อเริ่มต้นจัดระเบียบชีวิตกันเถอะ! ✨' : 'ยินดีต้อนรับกลับมา! พร้อมจะลุยหรือยัง? 🌟'}
                            </p>
                        </div>

                        {errorMsg && (
                            <div className="mb-4 p-3 bg-red-100 text-red-700 rounded-xl text-sm text-center font-medium">
                                {errorMsg}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-slate-600 mb-1">อีเมล</label>
                                <input 
                                    type="email" required value={email} onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-pastel-purpleDark focus:ring-2 focus:ring-pastel-purple transition-shadow duration-300"
                                    placeholder="hello@example.com"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-600 mb-1">รหัสผ่าน</label>
                                <input 
                                    type="password" required value={password} onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-pastel-purpleDark focus:ring-2 focus:ring-pastel-purple transition-shadow duration-300"
                                    placeholder="••••••••" minLength={6}
                                />
                            </div>
                            
                            <Button type="submit" className="w-full mt-6" disabled={loading}>
                                {loading ? <IconLoader /> : (isRegister ? 'สมัครสมาชิก' : 'เข้าสู่ระบบ')}
                            </Button>
                        </form>

                        <div className="mt-6 text-center text-sm text-slate-500">
                            {isRegister ? 'มีบัญชีอยู่แล้วใช่ไหม?' : "ยังไม่มีบัญชีใช่ไหม?"}{" "}
                            <button 
                                onClick={() => { setIsRegister(!isRegister); setErrorMsg(''); }}
                                className="text-pastel-purpleDark font-semibold hover:underline hover:text-purple-600 transition-colors"
                            >
                                {isRegister ? 'เข้าสู่ระบบเลย' : 'สมัครสมาชิกเลย'}
                            </button>
                        </div>
                    </Card>
                </div>
            );
        };

        // 2. Dashboard Screen
        const DashboardScreen = ({ tasks, user, loadingTasks }) => {
            const userName = user?.email?.split('@')[0] || 'User';
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(t => t.completed).length;
            const pendingTasks = totalTasks - completedTasks;
            const progress = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
            const todayTasks = tasks.filter(t => !t.completed).slice(0, 3);

            return (
                <div className="space-y-6 pb-24 md:pb-0 animate-fade-in pr-2 md:pr-0">
                    <header className="mb-8">
                        <div className="flex items-center gap-3">
                            <h1 className="text-2xl font-bold text-slate-800 truncate">สวัสดี, {userName}! 👋</h1>
                            <div className="flex items-center gap-1.5 px-2.5 py-1 bg-green-100 rounded-full shrink-0">
                                <span className="relative flex h-2.5 w-2.5">
                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                    <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                                </span>
                                <span className="text-[11px] font-bold text-green-700">ออนไลน์</span>
                            </div>
                        </div>
                        <p className="text-slate-500 mt-1">นี่คือภาพรวมความคืบหน้าของวันนี้ ลุยเลย! 🚀</p>
                    </header>

                    <Card className="bg-gradient-to-r from-pastel-purple to-pastel-pink border-none transform transition-transform hover:scale-[1.02] duration-300">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-semibold text-purple-900">ความคืบหน้าวันนี้</h2>
                            <span className="text-2xl font-bold text-purple-900">{progress}%</span>
                        </div>
                        <div className="w-full bg-white/50 rounded-full h-3 mb-2 overflow-hidden">
                            <div className="bg-purple-600 h-3 rounded-full transition-all duration-1000 ease-out" style={{ width: `${progress}%` }}></div>
                        </div>
                        <p className="text-sm text-purple-800 opacity-80">
                            ทำเสร็จแล้ว {completedTasks} จากทั้งหมด {totalTasks} งาน
                        </p>
                    </Card>

                    <div className="grid grid-cols-2 gap-4">
                        <Card className="text-center p-4 hover:bg-slate-50 transition-colors">
                            <div className="text-3xl font-bold text-slate-800 mb-1">{pendingTasks}</div>
                            <div className="text-sm text-slate-500 font-medium">งานที่ต้องทำ 📝</div>
                        </Card>
                        <Card className="text-center p-4 hover:bg-slate-50 transition-colors">
                            <div className="text-3xl font-bold text-pastel-purpleDark mb-1">{completedTasks}</div>
                            <div className="text-sm text-slate-500 font-medium">ทำเสร็จแล้ว ✅</div>
                        </Card>
                    </div>

                    <div>
                        <h3 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                            งานด่วนต่อไป <span className="text-xl">🎯</span>
                        </h3>
                        {loadingTasks ? (
                            <div className="text-center p-6 text-slate-400"><IconLoader /></div>
                        ) : todayTasks.length > 0 ? (
                            <div className="space-y-3">
                                {todayTasks.map(task => (
                                    <div key={task.id} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between transform transition-all hover:-translate-y-1 hover:shadow-md">
                                        <div className="flex items-center gap-3">
                                            <div className={`w-3 h-3 rounded-full shadow-sm ${
                                                task.priority === 'high' ? 'bg-red-400' : 
                                                task.priority === 'med' ? 'bg-yellow-400' : 'bg-green-400'
                                            }`}></div>
                                            <span className="font-medium text-slate-700">{task.title}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <div className="text-center p-8 bg-white rounded-3xl border border-slate-100 border-dashed transform transition-all hover:bg-slate-50">
                                <p className="text-slate-500 text-lg">ไม่มีงานค้างแล้ว เย้! 🎉</p>
                                <p className="text-sm text-slate-400 mt-2">ไปพักผ่อนหรือหาอะไรอร่อยๆ กินกันเถอะ</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 3. Task Management Screen
        const TasksScreen = ({ tasks, setTasks, user, loadingTasks, tasksError }) => {
            const [newTaskTitle, setNewTaskTitle] = useState('');
            const [priority, setPriority] = useState('low');
            const [isAdding, setIsAdding] = useState(false);
            const [processingIds, setProcessingIds] = useState(new Set());
            const [taskToDelete, setTaskToDelete] = useState(null);
            const [localError, setLocalError] = useState('');

            const addTask = async (e) => {
                e.preventDefault();
                if (!newTaskTitle.trim() || !user || isAdding) return;
                setIsAdding(true);
                
                const newTask = {
                    user_id: user.id,
                    title: newTaskTitle.trim(),
                    completed: false,
                    priority: priority
                };
                
                try {
                    const { data, error } = await supabase.from('tasks').insert([newTask]).select();
                    if (error) throw error;
                    if (data) setTasks([data[0], ...tasks]);
                    setNewTaskTitle('');
                    setPriority('low');
                } catch (err) {
                    setLocalError('เกิดข้อผิดพลาดในการเพิ่มงาน: ' + err.message);
                    setTimeout(() => setLocalError(''), 3000);
                } finally {
                    setIsAdding(false);
                }
            };

            const toggleTask = async (id, currentStatus) => {
                if (processingIds.has(id)) return;
                setProcessingIds(prev => new Set(prev).add(id));
                try {
                    const { error } = await supabase.from('tasks').update({ completed: !currentStatus }).eq('id', id);
                    if (error) throw error;
                    setTasks(tasks.map(t => t.id === id ? { ...t, completed: !currentStatus } : t));
                } catch (err) {
                    setLocalError('เกิดข้อผิดพลาด: ' + err.message);
                    setTimeout(() => setLocalError(''), 3000);
                } finally {
                    setProcessingIds(prev => { const next = new Set(prev); next.delete(id); return next; });
                }
            };

            const confirmDelete = async (id) => {
                setTaskToDelete(null);
                if (processingIds.has(id)) return;
                
                setProcessingIds(prev => new Set(prev).add(id));
                try {
                    const { error } = await supabase.from('tasks').delete().eq('id', id);
                    if (error) throw error;
                    setTasks(tasks.filter(t => t.id !== id));
                } catch (err) {
                    setLocalError('เกิดข้อผิดพลาด: ' + err.message);
                    setTimeout(() => setLocalError(''), 3000);
                } finally {
                    setProcessingIds(prev => { const next = new Set(prev); next.delete(id); return next; });
                }
            };

            return (
                <div className="space-y-6 pb-24 md:pb-0 h-full flex flex-col animate-fade-in pr-2 md:pr-0 relative">
                    
                    {/* Custom Alert / Modal for Deletion */}
                    {taskToDelete && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
                            <div className="bg-white p-6 rounded-3xl shadow-xl max-w-sm w-full text-center pop-in">
                                <div className="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <IconTrash />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">ลบงานนี้?</h3>
                                <p className="text-slate-500 mb-6">แน่ใจหรือไม่ว่าต้องการลบงานนี้? (ไม่สามารถกู้คืนได้นะ)</p>
                                <div className="flex gap-3 justify-center">
                                    <Button variant="ghost" onClick={() => setTaskToDelete(null)} className="flex-1 bg-slate-100 hover:bg-slate-200">ยกเลิก</Button>
                                    <Button variant="primary" className="flex-1 !bg-red-500 hover:!bg-red-600 shadow-red-200" onClick={() => confirmDelete(taskToDelete)}>ลบเลย</Button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Local Error Toast */}
                    {localError && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[60] bg-red-100 text-red-700 px-4 py-2 rounded-full text-sm font-bold shadow-lg border border-red-200 animate-fade-in whitespace-nowrap">
                            {localError}
                        </div>
                    )}

                    <header>
                        <h1 className="text-2xl font-bold text-slate-800">จัดการงาน 📋</h1>
                        <p className="text-slate-500 mt-1">จัดระเบียบและลำดับความสำคัญของงานคุณ</p>
                    </header>

                    <Card className="!p-4">
                        <form onSubmit={addTask} className="flex flex-col sm:flex-row gap-3">
                            <input 
                                type="text" value={newTaskTitle} onChange={(e) => setNewTaskTitle(e.target.value)}
                                placeholder="วันนี้ต้องทำอะไรบ้างนะ? ✨" disabled={isAdding}
                                className="flex-1 px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pastel-purple transition-shadow duration-300"
                            />
                            <div className="flex gap-2">
                                <select 
                                    value={priority} onChange={(e) => setPriority(e.target.value)} disabled={isAdding}
                                    className="px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pastel-purple text-sm cursor-pointer transition-shadow"
                                >
                                    <option value="low">สำคัญ: ต่ำ</option>
                                    <option value="med">สำคัญ: ปานกลาง</option>
                                    <option value="high">สำคัญ: สูง 🔥</option>
                                </select>
                                <Button type="submit" className="!px-4" disabled={isAdding || !newTaskTitle.trim()}>
                                    {isAdding ? <IconLoader /> : <IconPlus />}
                                </Button>
                            </div>
                        </form>
                    </Card>

                    <div className="flex-1 overflow-y-auto hide-scrollbar space-y-3 mt-4 pb-10">
                        {tasksError ? (
                            <div className="text-center p-6 bg-red-50 text-red-500 rounded-2xl">{tasksError}</div>
                        ) : loadingTasks ? (
                            <div className="text-center p-10 text-pastel-purpleDark"><IconLoader /></div>
                        ) : tasks.length === 0 ? (
                            <div className="text-center p-10 flex flex-col items-center justify-center h-40">
                                <div className="w-16 h-16 bg-pastel-cream rounded-full flex items-center justify-center text-3xl mb-4 animate-bounce">📝</div>
                                <h3 className="text-lg font-medium text-slate-700">ยังไม่มีงานเลย</h3>
                                <p className="text-slate-500 text-sm mt-1">เพิ่มงานใหม่ด้านบนเพื่อเริ่มต้นได้เลยนะ!</p>
                            </div>
                        ) : (
                            tasks.map(task => (
                                <div key={task.id} className={`group bg-white p-4 rounded-2xl border ${task.completed ? 'border-slate-100 opacity-60' : 'border-pastel-purple/30 shadow-sm'} flex items-center gap-4 transition-all duration-300 hover:shadow-md`}>
                                    <button 
                                        onClick={() => toggleTask(task.id, task.completed)}
                                        disabled={processingIds.has(task.id)}
                                        className={`w-7 h-7 rounded-full border-2 flex items-center justify-center transition-all duration-300 transform active:scale-75 ${
                                            task.completed ? 'bg-pastel-purpleDark border-pastel-purpleDark text-white scale-110' : 'border-slate-300 text-transparent hover:border-pastel-purpleDark hover:scale-110'
                                        } ${processingIds.has(task.id) ? 'opacity-50' : ''}`}
                                    >
                                        <IconCheck />
                                    </button>
                                    
                                    <div className="flex-1 min-w-0">
                                    <p className={`font-medium truncate transition-all duration-300 ${task.completed ? 'text-slate-400 line-through' : 'text-slate-700'}`}>
                                        {task.title}
                                    </p>
                                    <div className="flex items-center gap-2 mt-1">
                                        <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full shadow-sm ${
                                            task.priority === 'high' ? 'bg-red-100 text-red-600' :
                                            task.priority === 'med' ? 'bg-yellow-100 text-yellow-700' :
                                            'bg-green-100 text-green-700'
                                        }`}>
                                            ความสำคัญ: {task.priority === 'high' ? 'สูง' : task.priority === 'med' ? 'ปานกลาง' : 'ต่ำ'}
                                        </span>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setTaskToDelete(task.id)}
                                    disabled={processingIds.has(task.id)}
                                    className="text-slate-300 hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition-all duration-300 opacity-100 sm:opacity-0 group-hover:opacity-100 hover:scale-110 active:scale-95"
                                >
                                    <IconTrash />
                                </button>
                            </div>
                        ))
                    )}
                </div>
            </div>
        );
    };

    // 4. Timer Screen
    const TimerScreen = ({ time, setTime, isActive, setIsActive, selectedDuration, setSelectedDuration, showNotification, focusTopic, setFocusTopic }) => {
        const [showReceipt, setShowReceipt] = useState(false);
        const [isTearing, setIsTearing] = useState(false);
        const [timerError, setTimerError] = useState('');

        const handlePrepare = () => {
            if (!focusTopic.trim()) {
                setTimerError("กรุณากรอกเป้าหมายก่อนนะคะ จะได้รู้ว่าทำอะไรอยู่ 😊");
                setTimeout(() => setTimerError(''), 3000);
                return;
            }
            if (!selectedDuration || selectedDuration < 1) {
                setTimerError("กรุณาระบุเวลาให้ถูกต้องด้วยน้า (อย่างน้อย 1 นาที)");
                setTimeout(() => setTimerError(''), 3000);
                return;
            }
            setShowReceipt(true);
        };

        const handleTear = () => {
                setIsTearing(true);
                setTimeout(() => {
                    setShowReceipt(false);
                    setIsTearing(false);
                    setIsActive(true);
                }, 500); // match animation duration
            };

            const resetTimer = () => {
                setIsActive(false);
                setTime(selectedDuration * 60 || 25 * 60);
                setShowReceipt(false);
            };

            const handleDurationChange = (e) => {
                const val = e.target.value;
                if (val === '') {
                    setSelectedDuration('');
                    return;
                }
                const num = parseInt(val);
                if (!isNaN(num)) {
                    let finalNum = num;
                    if (num > 360) finalNum = 360; // Max 6 hours
                    setSelectedDuration(finalNum);
                    setTime(finalNum * 60);
                }
            };

            const handleDurationBlur = () => {
                if (selectedDuration === '' || selectedDuration < 1) {
                    setSelectedDuration(25);
                    setTime(25 * 60);
                }
            };

            const setQuickDuration = (mins) => {
                setSelectedDuration(mins);
                setTime(mins * 60);
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            // Calculate estimated end time for receipt
            const durationMins = selectedDuration || 0;
            const endTime = new Date(Date.now() + durationMins * 60000);
            const endTimeStr = endTime.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

            const totalSeconds = durationMins * 60;
            const progress = totalSeconds > 0 ? ((totalSeconds - time) / totalSeconds) * 100 : 0;
            const circleRadius = 120;
            const circumference = 2 * Math.PI * circleRadius;
            const strokeDashoffset = circumference - (progress / 100) * circumference;

            return (
            <div className="h-full flex flex-col pb-24 md:pb-0 animate-fade-in relative pr-2 md:pr-0">
                <header className="mb-4 text-center">
                    <h1 className="text-2xl font-bold text-slate-800">จับเวลาโฟกัส ⏱️</h1>
                    <p className="text-slate-500 mt-1">ค่อยๆ ทำไปทีละอย่างนะ สู้ๆ ✌️</p>
                </header>

                {/* Local Error Toast */}
                {timerError && (
                    <div className="absolute top-4 left-1/2 -translate-x-1/2 z-40 bg-red-100 text-red-700 px-4 py-2 rounded-full text-sm font-bold shadow-lg border border-red-200 animate-fade-in whitespace-nowrap">
                        {timerError}
                    </div>
                )}

                {showNotification && (
                    <div className="absolute top-0 left-0 right-0 bg-green-100 text-green-800 p-4 rounded-2xl text-center font-medium shadow-sm animate-fade-in z-20 border border-green-200 mx-4">
                            🎉 หมดเวลาแล้ว! เก่งมากเลย บันทึกประวัติให้แล้วนะ พักสายตาสักหน่อยนะ ☕
                        </div>
                    )}

                    {/* Receipt Modal Overlay */}
                    {showReceipt && !isTearing && (
                        <div className="absolute inset-0 z-30 flex flex-col items-center justify-center bg-slate-900/40 backdrop-blur-sm rounded-3xl">
                            <div className={`bg-white text-slate-800 w-64 p-6 shadow-2xl relative flex flex-col items-center pop-in ${isTearing ? 'tear-animation' : ''}`}>
                                <div className="text-center border-b-2 border-dashed border-slate-300 pb-4 mb-4 w-full">
                                    <h3 className="font-bold text-xl tracking-widest">FOCUS RECEIPT</h3>
                                    <p className="text-xs text-slate-500 mt-1">{new Date().toLocaleDateString('th-TH')}</p>
                                </div>
                                <div className="w-full space-y-3 mb-6">
                                    <div className="flex justify-between text-sm">
                                        <span className="text-slate-500">เป้าหมาย:</span>
                                        <span className="font-bold max-w-[120px] text-right truncate">{focusTopic}</span>
                                    </div>
                                    <div className="flex justify-between text-sm">
                                        <span className="text-slate-500">ระยะเวลา:</span>
                                        <span className="font-bold">{selectedDuration} นาที</span>
                                    </div>
                                    <div className="flex justify-between text-sm border-t border-slate-100 pt-2">
                                        <span className="text-slate-500">คาดว่าจะเสร็จ:</span>
                                        <span className="font-bold text-pastel-purpleDark">{endTimeStr} น.</span>
                                    </div>
                                </div>
                                <p className="text-[10px] text-slate-400 text-center uppercase tracking-widest">Tear to Start Focus</p>
                                
                                {/* Jagged edge effect */}
                                <div className="jagged-bottom"></div>
                            </div>
                            
                            {/* Tear Button / Drag Area */}
                            <button 
                                onClick={handleTear}
                                className="mt-8 px-6 py-3 bg-white/90 backdrop-blur rounded-full shadow-lg font-bold text-pastel-purpleDark animate-bounce hover:scale-110 transition-transform flex items-center gap-2"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
                                กดฉีกใบเสร็จเพื่อเริ่มเลย!
                            </button>
                            
                            <button onClick={() => setShowReceipt(false)} className="mt-4 text-white text-sm underline opacity-80 hover:opacity-100">
                                ยกเลิก
                            </button>
                        </div>
                    )}
                    
                    {/* Tearing Animation Layer */}
                    {isTearing && (
                        <div className="absolute inset-0 z-30 flex flex-col items-center justify-center pointer-events-none">
                            <div className="bg-white text-slate-800 w-64 p-6 shadow-2xl relative tear-animation">
                                <div className="text-center border-b-2 border-dashed border-slate-300 pb-4 mb-4 w-full">
                                    <h3 className="font-bold text-xl">FOCUS RECEIPT</h3>
                                </div>
                                <div className="jagged-bottom"></div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex flex-col lg:flex-row items-center justify-center gap-8 lg:gap-12 mt-4 relative">
                        
                        {/* Control Panel (Topic & Number Input) */}
                        {!isActive && (
                            <div className="flex flex-col items-center gap-6 bg-white p-6 rounded-3xl shadow-sm border border-slate-100 w-full max-w-xs animate-fade-in">
                                <div className="w-full">
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">เป้าหมายโฟกัส 🎯</label>
                                    <input 
                                        type="text" 
                                        value={focusTopic} 
                                        onChange={(e) => setFocusTopic(e.target.value)}
                                        placeholder="เช่น อ่านบทที่ 1..."
                                        className="w-full text-center px-4 py-3 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pastel-pink transition-shadow font-medium text-slate-700"
                                    />
                                </div>

                                <div className="w-full text-center mt-2">
                                    <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">เวลา (นาที)</label>
                                    <div className="flex items-center justify-center gap-3">
                                        <input 
                                            type="number" 
                                            min="1" 
                                            max="360"
                                            value={selectedDuration} 
                                            onChange={handleDurationChange}
                                            onBlur={handleDurationBlur}
                                            className="w-24 text-center text-4xl font-bold text-pastel-purpleDark px-2 py-2 rounded-2xl bg-slate-50 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pastel-purple transition-shadow"
                                        />
                                    </div>
                                    
                                    {/* Quick Select Buttons */}
                                    <div className="flex justify-center gap-2 mt-5">
                                        {[15, 25, 45, 60].map(mins => (
                                            <button
                                                key={mins}
                                                onClick={() => setQuickDuration(mins)}
                                                className="px-3 py-1.5 rounded-xl text-xs font-medium bg-pastel-cream text-yellow-800 hover:scale-105 active:scale-95 transition-transform"
                                            >
                                                {mins}m
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Timer Circle Area */}
                        <div className="flex flex-col items-center">
                            {isActive && focusTopic && (
                                <div className="mb-6 bg-white px-6 py-2 rounded-full shadow-sm border border-pastel-pink text-pastel-pinkDark font-bold animate-bounce text-sm">
                                    🎯 กำลังโฟกัส: {focusTopic}
                                </div>
                            )}

                            <div className="relative w-72 h-72 flex items-center justify-center mb-8">
                                {/* Running Bunny Overlay */}
                                {isActive && (
                                    <div className="absolute -top-10 left-1/2 -translate-x-1/2 z-10 w-full pointer-events-none">
                                        <CuteBunny className="running-bunny mx-auto drop-shadow-md" />
                                    </div>
                                )}
                                
                                <svg className="transform -rotate-90 w-full h-full absolute top-0 left-0 drop-shadow-md">
                                    <circle 
                                        cx="144" cy="144" r={circleRadius} 
                                        stroke="currentColor" strokeWidth="8" fill="transparent" 
                                        className="text-white"
                                    />
                                    <circle 
                                        cx="144" cy="144" r={circleRadius} 
                                        stroke="currentColor" strokeWidth="8" fill="transparent" 
                                        strokeDasharray={circumference}
                                        strokeDashoffset={strokeDashoffset}
                                        className="text-pastel-purpleDark transition-all duration-1000 ease-linear"
                                    />
                                </svg>
                                <div className="text-6xl font-bold text-slate-800 tracking-tighter relative z-0">
                                    {formatTime(time)}
                                </div>
                            </div>

                            {/* Controls */}
                            <div className="flex gap-4">
                                {!isActive ? (
                                    <Button onClick={handlePrepare} variant="primary" className="w-40 shadow-lg shadow-purple-200">
                                        เตรียมตัวโฟกัส 🚀
                                    </Button>
                                ) : (
                                    <Button onClick={resetTimer} variant="secondary" className="w-40 shadow-lg shadow-pink-200">
                                        ยกเลิก / หยุด ⏹️
                                    </Button>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 5. History Screen
        const HistoryScreen = ({ history, loadingHistory }) => {
            const totalMins = history.reduce((sum, item) => sum + item.duration_mins, 0);
            const totalHours = Math.floor(totalMins / 60);
            const remainingMins = totalMins % 60;

            return (
                <div className="space-y-6 pb-24 md:pb-0 h-full flex flex-col animate-fade-in pr-2 md:pr-0">
                    <header>
                        <h1 className="text-2xl font-bold text-slate-800">ประวัติการโฟกัส 📈</h1>
                        <p className="text-slate-500 mt-1">เวลาที่คุณตั้งใจทำสิ่งต่างๆ ยอดเยี่ยมมาก!</p>
                    </header>
                    
                    <Card className="bg-gradient-to-r from-pastel-pink to-pastel-purple border-none transform transition-transform hover:scale-[1.02] duration-300">
                        <h2 className="text-lg font-semibold text-purple-900 mb-2">เวลารวมทั้งหมดของคุณ</h2>
                        <div className="text-3xl font-bold text-purple-900">
                            {totalHours > 0 && <span>{totalHours} ชม. </span>}
                            <span>{remainingMins} นาที</span>
                        </div>
                    </Card>

                    <div className="flex-1 overflow-y-auto hide-scrollbar space-y-3 mt-4 pb-10">
                        {loadingHistory ? (
                            <div className="text-center p-10 flex flex-col items-center justify-center text-pastel-purpleDark">
                                <IconLoader />
                                <p className="text-slate-500 mt-2 text-sm">กำลังโหลดประวัติ...</p>
                            </div>
                        ) : history.length === 0 ? (
                            <div className="text-center p-10 flex flex-col items-center justify-center h-40">
                                <div className="w-16 h-16 bg-pastel-cream rounded-full flex items-center justify-center text-3xl mb-4 animate-bounce">🌱</div>
                                <h3 className="text-lg font-medium text-slate-700">ยังไม่มีประวัติ</h3>
                                <p className="text-slate-500 text-sm mt-1">เริ่มจับเวลาครั้งแรกเพื่อสร้างประวัติของคุณเลย!</p>
                            </div>
                        ) : (
                            history.map(item => (
                                <div key={item.id} className="bg-white p-4 rounded-2xl border border-pastel-purple/30 shadow-sm flex items-center justify-between hover:shadow-md transition-all duration-300 hover:-translate-y-1">
                                    <div className="min-w-0 pr-4">
                                        <h4 className="font-bold text-slate-700 truncate">{item.topic}</h4>
                                        <p className="text-xs text-slate-400 mt-1">
                                            {new Date(item.completed_at).toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' })} เวลา {new Date(item.completed_at).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })} น.
                                        </p>
                                    </div>
                                    <div className="bg-pastel-pink/30 px-3 py-1.5 rounded-xl shrink-0">
                                        <span className="font-bold text-pastel-pinkDark text-sm">{item.duration_mins} นาที</span>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        // --- Main App Component (Layout & Routing) ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [loadingAuth, setLoadingAuth] = useState(true);
            const [currentView, setCurrentView] = useState('dashboard');
            const [tasks, setTasks] = useState([]);
            const [loadingTasks, setLoadingTasks] = useState(false);
            const [tasksError, setTasksError] = useState('');
            
            // History State
            const [history, setHistory] = useState([]);
            const [loadingHistory, setLoadingHistory] = useState(false);

            // Global Timer State
            const [time, setTime] = useState(25 * 60);
            const [isActive, setIsActive] = useState(false);
            const [selectedDuration, setSelectedDuration] = useState(25);
            const [showNotification, setShowNotification] = useState(false);
            const [focusTopic, setFocusTopic] = useState('');

            // Check Active Session on Mount
            useEffect(() => {
                supabase.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user ?? null);
                    setLoadingAuth(false);
                });

                const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
                    setUser(session?.user ?? null);
                });

                return () => subscription.unsubscribe();
            }, []);

            // Fetch Tasks & History when User changes
            useEffect(() => {
                if (user) {
                    const fetchTasks = async () => {
                        setLoadingTasks(true);
                        setTasksError('');
                        const { data, error } = await supabase.from('tasks').select('*').order('created_at', { ascending: false });
                        if (error) setTasksError('ไม่สามารถโหลดข้อมูลงานได้ โปรดลองใหม่อีกครั้ง');
                        else if (data) setTasks(data);
                        setLoadingTasks(false);
                    };

                    const fetchHistory = async () => {
                        setLoadingHistory(true);
                        const { data, error } = await supabase.from('focus_history').select('*').order('completed_at', { ascending: false });
                        if (!error && data) setHistory(data);
                        setLoadingHistory(false);
                    };

                    fetchTasks();
                    fetchHistory();
                } else {
                    setTasks([]);
                    setHistory([]);
                }
            }, [user]);

            // Timer Tick & Save logic
            useEffect(() => {
                let interval = null;
                if (isActive && time > 0) {
                    interval = setInterval(() => setTime((t) => t - 1), 1000);
                } else if (isActive && time === 0) {
                    setIsActive(false);
                    setShowNotification(true);
                    setTimeout(() => setShowNotification(false), 5000);

                    // บันทึกประวัติ
                    const saveHistory = async () => {
                        if (!user) return;
                        const newRecord = {
                            user_id: user.id,
                            topic: focusTopic || 'โฟกัสทั่วไป',
                            duration_mins: selectedDuration,
                            completed_at: new Date().toISOString()
                        };
                        try {
                            const { data, error } = await supabase.from('focus_history').insert([newRecord]).select();
                            if (!error && data) setHistory(prev => [data[0], ...prev]);
                        } catch(e) { console.error("Save history error:", e); }
                    };
                    saveHistory();
                }
                return () => clearInterval(interval);
            }, [isActive, time, user, focusTopic, selectedDuration]);

            const handleLogout = async () => {
                await supabase.auth.signOut();
                setIsActive(false);
                setTime(25 * 60);
                setSelectedDuration(25);
            };

            if (loadingAuth) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-pastel-bg text-pastel-purpleDark">
                        <IconLoader />
                        <span className="mt-4 text-slate-500 font-medium">กำลังตรวจสอบข้อมูลผู้ใช้...</span>
                    </div>
                );
            }

            if (!user) {
                return <LoginScreen onLoginSuccess={setUser} />;
            }

            const NavItem = ({ view, icon: Icon, label }) => {
                const isSelected = currentView === view;
                return (
                    <button 
                        onClick={() => setCurrentView(view)}
                        className={`flex flex-col md:flex-row items-center gap-1 md:gap-3 p-2 md:px-4 md:py-3 rounded-2xl transition-all duration-300 hover:scale-[1.03] active:scale-95 ${
                            isSelected 
                            ? 'text-pastel-purpleDark bg-pastel-purple/20 font-semibold shadow-inner' 
                            : 'text-slate-400 hover:text-slate-600 hover:bg-slate-50'
                        }`}
                    >
                        <div className="relative">
                            <Icon />
                            {view === 'timer' && isActive && !isSelected && (
                                <span className="absolute -top-1 -right-1 flex h-2.5 w-2.5">
                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-pastel-pinkDark opacity-75"></span>
                                    <span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-pastel-pinkDark"></span>
                                </span>
                            )}
                        </div>
                        <span className="text-xs md:text-sm">{label}</span>
                    </button>
                );
            };

            return (
                <div className="min-h-screen bg-pastel-bg flex justify-center selection:bg-pastel-pink selection:text-pink-900 overflow-hidden">
                    <div className="w-full max-w-md bg-pastel-bg min-h-screen relative flex flex-col md:max-w-4xl md:flex-row shadow-2xl shadow-purple-900/5">
                        
                        <div className="md:hidden absolute top-6 right-6 z-10">
                            <button onClick={handleLogout} className="p-2 text-slate-400 bg-white rounded-full shadow-sm hover:text-red-500 hover:bg-red-50 transition-all duration-300 hover:scale-110 active:scale-95">
                                <IconLogOut />
                            </button>
                        </div>

                        <nav className="fixed bottom-0 w-full max-w-md md:max-w-none md:relative md:w-64 bg-white md:bg-transparent border-t md:border-t-0 md:border-r border-slate-100 md:border-slate-200 z-40 p-4 md:p-6 flex md:flex-col justify-around md:justify-start gap-2 shadow-[0_-10px_40px_rgba(0,0,0,0.03)] md:shadow-none pb-safe">
                            <div className="hidden md:flex items-center gap-3 mb-10 px-2 group cursor-pointer">
                                <img 
                                    src="image_4.png" 
                                    alt="Focus Buddy Logo" 
                                    className="w-10 h-10 rounded-xl transition-transform group-hover:rotate-12 duration-300 object-cover"
                                />
                                <span className="font-bold text-lg text-slate-800">Focus Buddy</span>
                            </div>

                            <NavItem view="dashboard" icon={IconHome} label="แดชบอร์ด" />
                            <NavItem view="tasks" icon={IconList} label="จัดการงาน" />
                            <NavItem view="timer" icon={IconClock} label="จับเวลา" />
                            <NavItem view="history" icon={IconHistory} label="ประวัติ" />
                            
                            <div className="hidden md:block mt-auto">
                                <button onClick={handleLogout} className="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-2xl transition-all duration-300 w-full hover:-translate-y-1 active:scale-95">
                                    <IconLogOut />
                                    <span className="text-sm font-medium">ออกจากระบบ</span>
                                </button>
                            </div>
                        </nav>

                        <main className="flex-1 p-6 md:p-10 overflow-y-auto h-screen relative">
                            {currentView === 'dashboard' && <DashboardScreen tasks={tasks} user={user} loadingTasks={loadingTasks} />}
                            {currentView === 'tasks' && <TasksScreen tasks={tasks} setTasks={setTasks} user={user} loadingTasks={loadingTasks} tasksError={tasksError} />}
                            {currentView === 'history' && <HistoryScreen history={history} loadingHistory={loadingHistory} />}
                            {currentView === 'timer' && (
                                <TimerScreen 
                                    time={time} setTime={setTime}
                                    isActive={isActive} setIsActive={setIsActive}
                                    selectedDuration={selectedDuration} setSelectedDuration={setSelectedDuration}
                                    showNotification={showNotification}
                                    focusTopic={focusTopic} setFocusTopic={setFocusTopic}
                                />
                            )}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
